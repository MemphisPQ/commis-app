<!doctype html>
<html lang="en">

  <meta name="theme-color" content="#1b4537" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0f1312" media="(prefers-color-scheme: dark)" />
  <title>Kitchen Costing</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

</head>
<body>
  <button class="btn skip" type="button" data-skip>Skip to the main content</button>
  <header class="top">
    <a class="brand" href="#/dishes"><span class="brand__name">My Kitchen</span><span class="brand__sub">Kitchen Costing</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#/dishes" data-nav="dishes"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16M6 17a6 6 0 0 1 12 0M12 8V6M10 6h4"/></svg><span class="nav__long">Dishes</span><span class="nav__short">Dishes</span></a>
      <a href="#/preps" data-nav="preps"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10h14v6a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-6ZM3 10h18M9 7c0-1 1-1.5 1-2.5M14 7c0-1 1-1.5 1-2.5"/></svg><span class="nav__long">Preps</span><span class="nav__short">Preps</span></a>
      <a href="#/ingredients" data-nav="ingredients"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21c4-3 6-7 6-11a6 6 0 0 0-12 0c0 4 2 8 6 11ZM12 4V2M9 3l3 1 3-1"/></svg><span class="nav__long">Ingredients</span><span class="nav__short">Items</span></a>

      <a href="#/changes" data-nav="changes"><svg class="nav__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span class="nav__long">Price changes</span><span class="nav__short">Changes</span> <span class="badge" id="changeCount" hidden></span></a>

    </nav>
    <button class="top__access" type="button" data-access-open aria-label="Accessibility options" title="Accessibility options"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M4.5 7.6c-.5-.1-1 .2-1.1.7-.1.5.2 1 .7 1.1 1.8.5 3.6.8 5.4.9-.1 2.300-.5 4.200-1.900 8.600-.2.5.1 1 .6 1.200.5.2 1-.1 1.200-.6.800-2.300 1.400-3.800 2.600-5.500 1.200 1.700 1.800 3.200 2.600 5.500.2.5.700.8 1.200.6.5-.2.8-.7.6-1.200-1.400-4.400-1.800-6.300-1.900-8.600 1.800-.1 3.600-.4 5.400-.9.5-.1.8-.6.7-1.100-.1-.5-.6-.8-1.100-.7-5.200 1.300-10.800 1.300-16 0Z"/></svg></button>
    <a class="top__tip" id="tipLink" target="_blank" rel="noopener" aria-label="Buy us a soda" hidden><span aria-hidden="true">♥</span> <span class="top__tip-long" aria-hidden="true">Buy us a soda</span><span class="top__tip-short" aria-hidden="true">Soda</span></a>
  </header>
  <aside class="mode" id="mode" aria-label="Notice" hidden></aside>
  <main id="main" tabindex="-1"><p class="muted">Loading…</p></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="ask" id="ask" aria-labelledby="askText">
    <form method="dialog">
      <p id="askText"></p>
      <input class="in in--wide" id="askInput" hidden />
      <div class="actions" id="askActions"></div>
    </form>
  </dialog>

  <datalist id="dl-items"></datalist>
  <datalist id="dl-ingredients"></datalist>
  <datalist id="dl-preps"></datalist>
  <datalist id="dl-suppliers"></datalist>
  <datalist id="dl-categories"></datalist>
  <datalist id="dl-menus"></datalist>
  <datalist id="dl-dish-cats"></datalist>

  <script src="config.js"></script>
  <script src="units.js"></script>
  <script src="costing.js"></script>
  <script src="summary.js"></script>
  <script src="auth.js"></script>
  <script src="store.js"></script>
  <script src="google.js"></script>
  <script src="pdftext.js"></script>
  <script src="invoices.js"></script>
  <script src="sundae.js"></script>
  <script src="cardfill.js"></script>
  <script src="sheetfill.js"></script>
  <script src="menufile.js"></script>
  <script src="app.js"></script>
</body>
</html>
